[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "the-handover"
version = "0.2.0"
description = "Human-in-the-loop approval SDK for AI agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "The Handover", email = "hello@thehandover.xyz" }]
keywords = ["ai", "agents", "human-in-the-loop", "approval", "hitl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["httpx>=0.24.0"]

[project.optional-dependencies]
langchain = ["langchain-core>=0.2.0"]
crewai = ["crewai>=0.41.0"]
openai = ["openai>=1.0.0"]
all = ["langchain-core>=0.2.0", "crewai>=0.41.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://thehandover.xyz"
Documentation = "https://thehandover.xyz/docs"
Repository = "https://github.com/TheTrueTcout/thehandover-python-sdk"
